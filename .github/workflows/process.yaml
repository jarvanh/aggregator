name: Process
on:
  schedule:
    - cron: "05 03 * * *"
    - cron: "05 11 * * *"
  workflow_dispatch:

env:
  # time zone
  TZ: Asia/Shanghai

  # gist link, 'username/gist_id' format, used to fill the gist id into the config
  GIST_LINK: ${{ secrets.GIST_LINK }}

  # token used to push to gist
  PUSH_TOKEN: ${{ secrets.GIST_PAT }}

  # token used to search subscription links on github
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # network reachable
  REACHABLE: ${{ vars.REACHABLE }}

  # not check connective
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}

  # skip remark
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}

  # workflow mode
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}

  # include spwcial protocols, such vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

concurrency:
  group: ${{ github.repository }}-process
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Config
        run: |
          GIST_ID=$(echo "$GIST_LINK" | awk -F'/' '{print $2}')
          if [ -z "$GIST_ID" ]; then
              echo "Error: environment 'GIST_LINK' is not valid, should be 'username/gist_id' format"
              exit 1
          fi
          sed "s/__GIST_ID__/$GIST_ID/g" subscribe/config/full.json > /tmp/process-config.json

      - name: Process
        run: python -u subscribe/process.py -s /tmp/process-config.json --overwrite

      - name: Timestamp
        run: date
