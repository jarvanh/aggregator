name: TGDiag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install
        run: pip3 install -q -r requirements.txt

      - name: Diagnose telegram reachability from runner
        run: |
          python3 - <<'EOF'
          import sys, os, subprocess, urllib.request
          print("egress IP:", urllib.request.urlopen("https://ifconfig.me", timeout=10).read().decode())
          sys.path.insert(0, 'subscribe')
          os.environ["ALLOW_SINGLE_LINK"] = "true"
          import utils, crawl
          c = utils.http_get(url="https://t.me/s/v2ray_vpn")
          print("http_get bytes:", len(c))
          if c:
              print("content has vmess://:", "vmess://" in c, "| vless://:", "vless://" in c)
          print("get_telegram_pages:", crawl.get_telegram_pages("v2ray_vpn"))
          for ch in ["v2ray_vpn", "proxy_mtm", "SOSkeyNET"]:
              r = crawl.crawl_telegram(users={ch: {"include": "", "exclude": "", "push_to": ["full"]}}, pages=2)
              k = [x for x in r if x.startswith("singlelink")]
              print(f"{ch}: links={len(r[k[0]]['proxies']) if k else 0}")
          all7 = ["v2ray_vpn","proxy_mtm","PrivateVPNs","DirectVPN","VmessProtocol","SOSkeyNET","v2rayprotocol"]
          r = crawl.crawl_telegram(users={c: {"include": "", "exclude": "", "push_to": ["full"]} for c in all7}, pages=2)
          k = [x for x in r if x.startswith("singlelink")]
          print(f"ALL7-CONCURRENT: links={len(r[k[0]]['proxies']) if k else 0}")
          EOF
